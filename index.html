<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brevet blanc — Mathématiques</title>
<style>
:root{--blue:#0021BC;--blue-lt:#BDD4E7;--orange:#EE6E34;--bg:#EDEEF0;--white:#FFFFFF;--ink:rgb(25,8,6);--muted:#8A8DAA;--green:#22C55E;--fd:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:var(--fd);-webkit-font-smoothing:antialiased;}
.nav{display:flex;justify-content:space-between;align-items:flex-start;padding:20px 32px 0;background:var(--bg);flex-shrink:0;position:relative;z-index:10;}
.logo{cursor:pointer;text-decoration:none;color:inherit;flex-shrink:0}
.logo a{text-decoration:none;color:inherit}
.logo-top{font-size:12px;color:var(--ink);display:block}
.logo-bot{font-size:28px;font-weight:800;letter-spacing:-.04em;line-height:.9;text-transform:uppercase;display:block}
.logo-bot span{color:var(--blue)}
.nav-center{display:flex;align-items:center;gap:32px;flex:1;justify-content:center}
.nav-r{display:flex;align-items:center;gap:12px}
.timer-wrap{display:flex;align-items:center;gap:8px;background:var(--white);border:1.5px solid rgba(0,0,0,.08);border-radius:100px;padding:7px 16px}
.timer-dot{width:8px;height:8px;border-radius:50%;background:var(--orange);animation:pulse 1s ease-in-out infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.timer-val{font-size:13px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
.pts-pill{font-size:12px;font-weight:600;color:var(--blue);background:#EEF2FF;padding:7px 16px;border-radius:100px;border:1.5px solid rgba(0,33,188,.15)}
.stage{display:flex;flex-direction:column;width:100%;position:absolute;top:68px;bottom:0;left:0;right:0;overflow:hidden;background:var(--bg)}
.main{display:grid;grid-template-columns:210px 1fr;overflow:hidden;flex:1;padding:12px 20px 16px;gap:10px;align-items:stretch;min-height:0;height:100%}
.sidebar{background:var(--white);border-radius:18px;border:1.5px solid rgba(0,0,0,.08);padding:14px 12px;display:flex;flex-direction:column;gap:10px;overflow:hidden;min-height:0}
.ex-list-wrap{flex:1;overflow-y:auto;min-height:0;scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.12) transparent}
.ex-list-wrap::-webkit-scrollbar{width:4px}
.ex-list-wrap::-webkit-scrollbar-thumb{background:rgba(0,0,0,.12);border-radius:4px}
.sidebar-label{font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.ex-list{display:flex;flex-direction:column;gap:4px}
.ex-item{border-radius:10px;cursor:pointer;border:1.5px solid transparent;overflow:hidden;transition:background .15s}
.ex-item:hover .ex-header{background:var(--bg)}
.ex-item.active .ex-header{background:#EEF2FF}
.ex-item.active{border-color:rgba(0,33,188,.15)}
.ex-item.done{border-color:rgba(34,197,94,.2)}
.ex-item.done .ex-header{background:#EDFBF0}
.ex-header{display:flex;align-items:center;gap:10px;padding:8px 10px}
.ex-num{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.ex-item.active .ex-num{background:var(--blue);color:#fff}
.ex-item.done .ex-num{background:var(--green);color:#fff}
.ex-item:not(.active):not(.done) .ex-num{background:var(--bg);color:var(--muted)}
.ex-info{flex:1;min-width:0}
.ex-name{font-size:12px;font-weight:500;letter-spacing:-.01em;text-transform:lowercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-sub{font-size:10px;color:var(--muted);margin-top:2px;font-weight:300}
.ex-dots{display:flex;gap:4px;padding:4px 10px 8px 46px}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(0,0,0,.1);transition:background .2s;cursor:pointer}
.dot.done{background:var(--green)}
.dot.active{background:var(--blue)}
.sidebar-progress{margin-top:auto;padding-top:10px;border-top:1px solid rgba(0,0,0,.06)}
.prog-label{font-size:10px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:6px;font-weight:500}
.prog-bar{height:4px;background:rgba(0,0,0,.07);border-radius:100px;overflow:hidden}
.prog-fill{height:100%;background:var(--blue);border-radius:100px;transition:width .4s ease}
.content{display:flex;flex-direction:column;overflow:hidden;min-height:0}
.question-card{background:var(--white);border-radius:18px;border:1.5px solid rgba(0,0,0,.08);overflow:hidden;display:grid;grid-template-rows:auto auto 1fr auto;height:100%;min-height:0}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:10px 22px;border-bottom:1px solid rgba(0,0,0,.06);background:var(--white);flex-shrink:0}
.card-footer{display:flex;align-items:center;justify-content:space-between;padding:10px 22px;border-top:1px solid rgba(0,0,0,.06);background:var(--white);flex-shrink:0}
.card-prog{height:3px;background:rgba(0,0,0,.06);flex-shrink:0}
.card-prog-fill{height:100%;background:var(--blue);transition:width .3s}
.q-meta{display:flex;align-items:center;gap:8px}
.q-tag{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 12px;border-radius:100px;background:#EEF2FF;color:var(--blue)}
.q-pts-badge{font-size:11px;font-weight:500;color:var(--muted)}
.q-breadcrumb{font-size:11px;color:var(--muted);font-weight:500;text-align:right;line-height:1.5}
.q-breadcrumb strong{color:var(--ink);font-weight:600}
.card-body{display:grid;grid-template-columns:1fr auto;overflow:hidden;flex:1}
.card-body.no-figure{grid-template-columns:1fr}
.card-main{display:grid;grid-template-rows:auto 1fr;overflow:hidden;padding:18px 26px;gap:12px}
.q-block{display:flex;flex-direction:column;gap:10px;flex-shrink:0}
.q-stimulus{background:var(--bg);border-left:3px solid var(--blue-lt);border-radius:0 8px 8px 0;padding:10px 16px;font-size:13px;line-height:1.7;font-weight:300}
.q-stimulus-label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.q-number-label{font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--blue);display:flex;align-items:center;gap:8px}
.q-number-label::after{content:'';flex:0 0 28px;height:1.5px;background:var(--blue-lt);border-radius:2px}
.q-text{font-size:14px;font-weight:400;line-height:1.8;color:var(--ink)}
.answer-block{display:flex;flex-direction:column;gap:6px;overflow:hidden;min-height:0}
.answer-label{font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.answer-textarea{flex:1;width:100%;font-family:var(--fd);font-size:14px;line-height:1.75;border:1.5px solid rgba(0,0,0,.1);border-radius:12px;padding:12px 16px;resize:none;background:var(--bg);color:var(--ink);outline:none;transition:border-color .15s;min-height:0}
.answer-textarea:focus{border-color:var(--blue);background:var(--white)}
.answer-hint{font-size:10px;color:var(--muted);text-align:right;flex-shrink:0}
.card-figure{width:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 10px;border-left:1px solid rgba(0,0,0,.06);background:var(--bg);flex-shrink:0}
.fig-label{font-size:10px;color:var(--muted);text-align:center;margin-top:8px;font-style:italic;line-height:1.4}
.btn{font-family:var(--fd);font-size:13px;font-weight:600;border:none;border-radius:100px;cursor:pointer;padding:9px 20px;transition:opacity .15s;display:inline-flex;align-items:center;gap:6px;text-transform:lowercase;letter-spacing:-.01em}
.btn:hover{opacity:.85}
.btn-ghost{background:transparent;border:1.5px solid rgba(0,0,0,.14);color:var(--ink)}
.btn-primary{background:var(--blue);color:#fff}
.btn-orange{background:var(--orange);color:#fff}
.step-info{font-size:12px;color:var(--muted);text-align:center;font-weight:300}
.end-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:20px;text-align:center;padding:40px}
</style>
</head>
<body>
<nav class="nav">
  <div class="logo"><a href="#"><span class="logo-top">prépa</span><span class="logo-bot">bre<span>.</span>vet</span></a></div>
  <div class="nav-center"></div>
  <div class="nav-r">
    <div class="timer-wrap">
      <div class="timer-dot" id="timerDot"></div>
      <span class="timer-val" id="timerVal">2:00:00</span>
    </div>
    <span class="pts-pill" id="ptsPill">0 / 100 pts</span>
  </div>
</nav>

<div class="stage">
  <div class="main">
    <div class="sidebar">
      <div class="ex-list-wrap">
        <div class="sidebar-label">Exercices</div>
        <div class="ex-list" id="exList"></div>
      </div>
      <div class="sidebar-progress">
        <div class="prog-label">
          <span id="progText">0 / 6 questions</span>
          <span id="progPct">0%</span>
        </div>
        <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
      </div>
    </div>
    <div class="content">
      <div class="question-card" id="questionCard"></div>
    </div>
  </div>
</div>

const answers={};let curEx=1,curQ=0;const doneSet=new Set();
function key(e,q){return e+"-"+q}
function totalDone(){return doneSet.size}
function totalQ(){return exercises.reduce((s,e)=>s+e.questions.length,0)}
function totalPts(){return exercises.reduce((s,e)=>s+e.pts,0)}

function buildSidebar(){
  const el=document.getElementById("exList");el.innerHTML="";
  exercises.forEach(ex=>{
    const isActive=ex.id===curEx;
    const allDone=ex.questions.every((_,i)=>doneSet.has(key(ex.id,i)));
    const item=document.createElement("div");
    item.className="ex-item"+(isActive?" active":"")+(allDone&&!isActive?" done":"");
    const dots=ex.questions.map((_,i)=>{
      const d=doneSet.has(key(ex.id,i));const a=isActive&&i===curQ;
      return '<div class="dot '+(d?"done":"")+" "+(a?"active":"")+'" onclick="jumpTo('+ex.id+','+i+')"></div>';
    }).join("");
    item.innerHTML='<div class="ex-header"><div class="ex-num">'+(allDone&&!isActive?"✓":ex.num)+'</div><div class="ex-info"><div class="ex-name">'+ex.name+'</div><div class="ex-sub">'+ex.sub+'</div></div></div><div class="ex-dots">'+dots+'</div>';
    item.querySelector(".ex-header").onclick=()=>jumpTo(ex.id,0);
    el.appendChild(item);
  });
  const done=totalDone(),total=totalQ(),pct=Math.round(done/total*100);
  document.getElementById("progText").textContent=done+" / "+total+" questions";
  document.getElementById("progPct").textContent=pct+"%";
  document.getElementById("progFill").style.width=pct+"%";
  document.getElementById("ptsPill").textContent=Math.min(done,totalPts())+" / "+totalPts()+" pts";
}

function buildQuestion(){
  const ex=exercises.find(e=>e.id===curEx);
  const q=ex.questions[curQ];
  const card=document.getElementById("questionCard");
  const hasFig=!!(ex.figure);
  const saved=answers[key(curEx,curQ)]||"";
  const progPct=Math.round(curQ/ex.questions.length*100);
  const stimHTML=ex.stimulus?'<div style="font-size:13px;font-weight:300;line-height:1.7;color:var(--ink);margin-bottom:6px;font-style:italic">'+ex.stimulus.split("\n").map(l=>'<p style="margin-bottom:.18em">'+l+'</p>').join("")+'</div>':"";
  const contextHTML=q.context?'<p style="font-size:13px;font-weight:300;line-height:1.7;color:var(--ink);margin-bottom:6px;font-style:italic">'+q.context+'</p>':"";

  // Résoudre la figure à utiliser
  const fig = q.figureOverride || (ex.id===1 ? figureVelo : (ex.figure||""));
  const figLbl = q.figureOverride ? "" : (ex.figureLabel||"");

  let bodyHTML;
  if(q.figureWide){
    // Layout 2 colonnes : figure/contexte à gauche, question+réponse à droite
    const leftContent =
      (q.context?'<p style="font-size:12px;font-weight:300;line-height:1.65;color:var(--ink);font-style:italic;flex-shrink:0">'+q.context+'</p>':"")
      + (stimHTML?stimHTML:"")
      +'<div style="background:var(--white);border-radius:12px;padding:12px 8px 8px;border:1.5px solid rgba(0,0,0,.06);display:flex;flex-direction:column;align-items:center;justify-content:center">'+fig+(figLbl?'<div style="font-size:10px;color:var(--muted);text-align:center;margin-top:6px;font-style:italic">'+figLbl+'</div>':"")+'</div>';
    bodyHTML='<div class="card-body no-figure" style="display:grid;grid-template-columns:1fr 1fr;overflow:hidden;gap:0">'
      +'<div style="overflow-y:auto;padding:14px 18px;border-right:1px solid rgba(0,0,0,.06);display:flex;flex-direction:column;gap:10px;min-height:0">'+leftContent+'</div>'
      +'<div style="display:flex;flex-direction:column;overflow:hidden;padding:14px 18px;gap:12px">'
        +'<div class="q-block" style="flex-shrink:0"><div class="q-number-label">Question '+(curQ+1)+'</div><div class="q-text">'+q.text+'</div></div>'
        +'<div class="answer-block" style="flex:1;min-height:0"><div class="answer-label">Ta réponse</div><textarea class="answer-textarea" id="answerTA" placeholder="Rédige tes calculs et réponses ici…">'+saved+'</textarea><div class="answer-hint" id="ansHint">'+cw(saved)+' mot(s)</div></div>'
      +'</div></div>'
    +(q.figureExtra?'<div style="padding:0 14px 14px">'+q.figureExtra+'</div>':'');
  } else {
    // Layout standard : stimulus + contexte + question, pleine largeur
    bodyHTML='<div class="card-body no-figure"><div class="card-main"><div class="q-block">'+stimHTML+contextHTML+'<div class="q-number-label">Question '+(curQ+1)+'</div><div class="q-text">'+q.text+'</div></div><div class="answer-block"><div class="answer-label">Ta réponse</div><textarea class="answer-textarea" id="answerTA" placeholder="Rédige tes calculs et réponses ici…">'+saved+'</textarea><div class="answer-hint" id="ansHint">'+cw(saved)+' mot(s)</div></div></div></div>';
  }

  card.innerHTML='<div class="card-header"><div class="q-meta"><span class="q-tag">Ex. '+ex.id+' — '+ex.name+'</span><span class="q-pts-badge">'+q.pts+' pts</span></div><div class="q-breadcrumb">Question <strong>'+(curQ+1)+'</strong> / '+ex.questions.length+'</div></div><div class="card-prog"><div class="card-prog-fill" style="width:'+progPct+'%"></div></div>'+bodyHTML+'<div class="card-footer" id="footerNav"></div>';

  const ta=document.getElementById("answerTA");
  ta.addEventListener("input",()=>{answers[key(curEx,curQ)]=ta.value;document.getElementById("ansHint").textContent=cw(ta.value)+" mot(s)";});
  buildFooter(ex);
}

function cw(s){return s.trim().split(/\s+/).filter(Boolean).length}

function buildFooter(ex){
  const nav=document.getElementById("footerNav");
  const isLastQ=curQ===ex.questions.length-1,isLastEx=ex.id===exercises[exercises.length-1].id,isFirst=curEx===exercises[0].id&&curQ===0;
  const gi=getGI(),gt=totalQ();
  nav.innerHTML=((!isFirst)?'<button class="btn btn-ghost" onclick="goPrev()">← précédent</button>':'<div></div>')+'<div class="step-info">Question '+(gi+1)+' sur '+gt+' au total</div>'+(isLastQ&&isLastEx?'<button class="btn btn-orange" onclick="handleSubmit()">Terminer l\'examen →</button>':'<button class="btn btn-primary" onclick="goNext()">Valider →</button>');
}

function getGI(){let i=0;for(const ex of exercises){if(ex.id===curEx)return i+curQ;i+=ex.questions.length;}return i;}
function saveAnswer(){const ta=document.getElementById("answerTA");if(ta)answers[key(curEx,curQ)]=ta.value;}
function goNext(){
  saveAnswer();doneSet.add(key(curEx,curQ));
  const ex=exercises.find(e=>e.id===curEx);
  if(curQ<ex.questions.length-1){curQ++;}
  else{const nx=exercises.find(e=>e.id===curEx+1);if(nx){curEx=nx.id;curQ=0;}}
  buildSidebar();buildQuestion();
}
function goPrev(){
  saveAnswer();
  if(curQ>0){curQ--;}
  else{const px=exercises.find(e=>e.id===curEx-1);if(px){curEx=px.id;curQ=px.questions.length-1;}}
  buildSidebar();buildQuestion();
}
function jumpTo(exId,qIdx){saveAnswer();curEx=exId;curQ=qIdx;buildSidebar();buildQuestion();}
function handleSubmit(){
  saveAnswer();doneSet.add(key(curEx,curQ));buildSidebar();
  document.getElementById("questionCard").innerHTML='<div class="end-screen"><div style="font-size:2.8em;font-family:var(--fd);font-weight:800;color:var(--blue);letter-spacing:-.04em;line-height:1.05">brevet blanc<br>terminé !</div><p style="font-size:.85em;color:var(--muted);max-width:30em;line-height:1.7">Ton devoir a bien été soumis. Les corrections seront disponibles dans ton espace <strong>mon parcours</strong>.</p><div style="display:flex;gap:1em;margin-top:.4em"><button class="btn btn-ghost" onclick="jumpTo(1,0)">Revoir mes réponses</button><button class="btn btn-primary">Voir les corrections →</button></div></div>';
}
function tick(){
  if(totalSecs<=0){document.getElementById("timerVal").textContent="0:00:00";document.getElementById("timerDot").style.background="#E24B4A";return;}
  totalSecs--;
  const h=Math.floor(totalSecs/3600),m=Math.floor((totalSecs%3600)/60),s=totalSecs%60;
  document.getElementById("timerVal").textContent=h+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  if(totalSecs<900)document.getElementById("timerDot").style.background="#E24B4A";
}
let totalSecs=7200;
buildSidebar();buildQuestion();setInterval(tick,1000);
</script>
</body>
</html>
